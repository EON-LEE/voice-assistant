version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/src/*"
      - "/tests/*"
      - "/tools/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the test toolchain instead of one per test project and package.
      test-frameworks:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"
          - "coverlet*"
      nuget-minor-and-patch:
        update-types: [minor, patch]
    # NAudio 3 splits the packages, requires .NET 9+ and changes custom provider Read signatures. Moving the Teams
    # process-loopback and PCM conversion code to it is a deliberate migration that needs a real-device capture test,
    # not an automatic bump. Minor and patch updates of NAudio 2 still arrive.
    ignore:
      - dependency-name: "NAudio*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directories:
      - "/src/VoiceAssistant.Web"
      - "/tests/VoiceAssistant.Web.E2E"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - "/src/VoiceAssistant.Api"
      - "/tools/VoiceAssistant.LiveProbe"
      - "/infra/private-ingestion"
    schedule:
      interval: weekly
    # Base images stay on the runtime line the projects target (.NET 10 LTS, Node LTS).
    # Moving to a new major runtime is a deliberate migration, not an automatic bump.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
