name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch or PR; a newer push to the same PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.*.props', '**/global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            src/VoiceAssistant.Web/package-lock.json
            tests/VoiceAssistant.Web.E2E/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Acquire verified Bicep compiler
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'bicep.exe'
          Invoke-WebRequest 'https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-win-x64.exe' -OutFile $path
          $expected = '3f343ab1ce41feac156464adee3dc499cb6c197366fc731aed276192011d867c'
          if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $expected) { throw 'Bicep checksum mismatch.' }
      - name: Verify all local acceptance gates
        shell: pwsh
        run: |
          .\scripts\verify-release.ps1 -InstallBrowsers `
            -BicepPath (Join-Path $env:RUNNER_TEMP 'bicep.exe') `
            -ReportPath (Join-Path $env:RUNNER_TEMP 'release-verification.json')
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-evidence
          path: ${{ runner.temp }}/release-verification.json
          if-no-files-found: warn
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-report
          path: tests/VoiceAssistant.Web.E2E/playwright-report/
          if-no-files-found: ignore

  linux-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build non-root Linux web image
        run: docker build --file src/VoiceAssistant.Api/Dockerfile --tag voice-assistant:test .
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: tests/VoiceAssistant.Web.E2E/package-lock.json
      - name: Install locked browser test dependencies
        working-directory: tests/VoiceAssistant.Web.E2E
        run: npm ci --no-audit --no-fund
      - name: Run container and verify browser lifecycle
        shell: bash
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --rm \
            --env ASPNETCORE_ENVIRONMENT=Development \
            --env Provider__Mode=Fake voice-assistant:test)
          trap 'docker stop "$container_id" >/dev/null' EXIT
          version=$(node -p "require('./tests/VoiceAssistant.Web.E2E/node_modules/playwright/package.json').version")
          docker run --rm --network "container:$container_id" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --workdir /work/tests/VoiceAssistant.Web.E2E \
            --env CI=true \
            --env VOICE_ASSISTANT_WEB_URL=http://localhost:8080 \
            --env VOICE_ASSISTANT_BACKEND_E2E=1 \
            --env VOICE_ASSISTANT_API_EXTERNAL=1 \
            "mcr.microsoft.com/playwright:v${version}-noble" \
            node node_modules/@playwright/test/cli.js test
      - name: Upload Linux browser test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-browser-test-report
          path: tests/VoiceAssistant.Web.E2E/playwright-report/
          if-no-files-found: ignore
